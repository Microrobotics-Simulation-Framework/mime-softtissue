[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mime-softtissue"
version = "0.1.0"
description = "A soft-tissue plugin for MIME: a large-strain solid with phase-field fracture in JAX, a fitting harness, and clot records (prototype)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mime-engine[verify]>=0.3.0.dev1,<0.4", "scipy"]
# authors = [{ name = "<your name>" }]

[project.optional-dependencies]
# The tests (`pip install -e ".[test]"`); Hypothesis comes with `mime-engine[verify]`. `typing` is what CI's typing job installs
# (pyright strict over the package, and tests/assert_types.py): pinned to the release this template was checked with, because
# a newer pyright can add a check and turn the job red; raise it on purpose.
test = ["pytest>=8.0"]
typing = ["pyright==1.1.414"]

# How MIME finds your entries: it imports this module, which registers them. The namespace is the word before the dot in
# every entry's name (entries use `.`, records `_`, an instance `:`, as in `softtissue.example_load:probe`).
[project.entry-points."mime.entries"]
softtissue = "mime_softtissue.entries"

# How MIME finds your records: the folder beside records.json. Its name here is the source a `package:` location names.
[project.entry-points."mime.assets"]
softtissue = "mime_softtissue.records"

[tool.hatch.build.targets.wheel]
packages = ["src/mime_softtissue"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "scripts", "docs", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "examples"]
# The default lane skips `slow`: a test that takes minutes goes behind the marker and runs in its own CI lane (the `slow`
# job of .github/workflows/ci.yml, on a pull request labelled `slow` and every week). A physics assertion behind `slow` is
# documentation unless a lane runs it.
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = ["slow: minutes of CPU: run by the `slow` lane of CI, not the default one"]
